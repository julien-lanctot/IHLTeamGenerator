<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHL Team Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-randomize {
            background-color: #4CAF50;
            color: white;
        }

        .btn-randomize:hover {
            background-color: #45a049;
        }

        .btn-reset {
            background-color: #2196F3;
            color: white;
        }

        .btn-reset:hover {
            background-color: #0b7dda;
        }

        .btn-screenshot {
            background-color: #FF9800;
            color: white;
        }

        .btn-screenshot:hover {
            background-color: #e68900;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }

        .btn-whatsapp:hover {
            background-color: #1da851;
        }

        #teams-display {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .team {
            flex: 1;
            padding: 30px;
            min-height: 400px;
        }

        .team-white {
            background-color: white;
            color: black;
        }

        .team-black {
            background-color: black;
            color: white;
        }

        .team h2 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-decoration: underline;
        }

        .player {
            font-size: 28px;
            margin-bottom: 10px;
            padding: 5px;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: text;
        }

        .player:hover {
            border-color: #666;
        }

        .player[contenteditable="true"]:focus {
            outline: none;
            border-color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
        }

        .team-black .player[contenteditable="true"]:focus {
            background-color: rgba(76, 175, 80, 0.2);
        }

        .goalie {
            margin-top: 20px;
            font-weight: normal;
        }

        .player-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-container .player {
            flex: 1;
        }

        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        .lock-btn:hover {
            opacity: 0.8;
        }

        .lock-btn.locked {
            opacity: 1;
        }

        .player.locked {
            background-color: rgba(255, 193, 7, 0.2);
            border-color: #FFC107;
        }

        .team-black .player.locked {
            background-color: rgba(255, 193, 7, 0.3);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .controls {
                gap: 5px;
                margin-bottom: 12px;
            }

            button {
                padding: 8px 12px;
                font-size: 12px;
            }

            .team {
                padding: 12px 8px;
                min-height: auto;
            }

            .team h2 {
                font-size: 20px;
                margin-bottom: 8px;
            }

            .player {
                font-size: 16px;
                margin-bottom: 4px;
                padding: 2px;
            }

            .goalie {
                margin-top: 8px;
            }

            .lock-btn {
                font-size: 14px;
                padding: 2px;
            }

            .player-container {
                gap: 4px;
            }

            .notification {
                bottom: 10px;
                right: 10px;
                left: 10px;
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            h1 {
                font-size: 16px;
                margin-bottom: 10px;
            }

            .controls {
                gap: 4px;
                margin-bottom: 10px;
            }

            button {
                padding: 6px 10px;
                font-size: 11px;
            }

            .team {
                padding: 10px 6px;
            }

            .team h2 {
                font-size: 18px;
                margin-bottom: 6px;
            }

            .player {
                font-size: 14px;
                margin-bottom: 3px;
                padding: 2px;
            }

            .goalie {
                margin-top: 6px;
            }

            .lock-btn {
                font-size: 12px;
                padding: 1px;
            }

            .player-container {
                gap: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IHL Team Generator</h1>

        <div class="controls">
            <button class="btn-randomize" onclick="randomizeTeams()">Randomize Teams</button>
            <button class="btn-reset" onclick="resetToDefault()">Reset to Default</button>
            <button class="btn-screenshot" onclick="captureScreenshot()">Copy Screenshot</button>
            <button class="btn-whatsapp" onclick="shareToWhatsApp()">Share to WhatsApp</button>
        </div>

        <div id="teams-display">
            <div class="team team-white">
                <h2>White</h2>
                <div id="white-players"></div>
            </div>
            <div class="team team-black">
                <h2>Black</h2>
                <div id="black-players"></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        // Default team data
        const defaultTeams = {
            white: {
                players: ['Tom', 'Derek', 'Al', 'Robert', 'Joe', 'LP'],
                goalie: 'Chris'
            },
            black: {
                players: ['Peter', 'Yero', 'Emile', 'Jon', 'Rolland', 'Stephan'],
                goalie: 'Julien'
            }
        };

        // Current teams data
        let currentTeams = JSON.parse(JSON.stringify(defaultTeams));

        // Track locked players: { white: [false, false, ...], black: [false, false, ...] }
        let lockedPlayers = {
            white: new Array(defaultTeams.white.players.length).fill(false),
            black: new Array(defaultTeams.black.players.length).fill(false)
        };

        // Initialize the display
        function init() {
            displayTeams();
        }

        // Display teams
        function displayTeams() {
            const whitePlayersDiv = document.getElementById('white-players');
            const blackPlayersDiv = document.getElementById('black-players');

            // Clear previous content
            whitePlayersDiv.innerHTML = '';
            blackPlayersDiv.innerHTML = '';

            // Display white team players
            currentTeams.white.players.forEach((player, index) => {
                const playerDiv = createPlayerDiv(player, 'white', index);
                whitePlayersDiv.appendChild(playerDiv);
            });

            // Display white team goalie
            const whiteGoalieDiv = createGoalieDiv(currentTeams.white.goalie, 'white');
            whitePlayersDiv.appendChild(whiteGoalieDiv);

            // Display black team players
            currentTeams.black.players.forEach((player, index) => {
                const playerDiv = createPlayerDiv(player, 'black', index);
                blackPlayersDiv.appendChild(playerDiv);
            });

            // Display black team goalie
            const blackGoalieDiv = createGoalieDiv(currentTeams.black.goalie, 'black');
            blackPlayersDiv.appendChild(blackGoalieDiv);
        }

        // Create player div with lock button
        function createPlayerDiv(playerName, team, index) {
            const container = document.createElement('div');
            container.className = 'player-container';

            const div = document.createElement('div');
            div.className = 'player' + (lockedPlayers[team][index] ? ' locked' : '');
            div.textContent = playerName;
            div.contentEditable = true;
            div.addEventListener('blur', function() {
                currentTeams[team].players[index] = this.textContent.trim();
            });
            div.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.blur();
                }
            });

            const lockBtn = document.createElement('button');
            lockBtn.className = 'lock-btn' + (lockedPlayers[team][index] ? ' locked' : '');
            lockBtn.textContent = lockedPlayers[team][index] ? '🔒' : '🔓';
            lockBtn.title = lockedPlayers[team][index] ? 'Unlock player' : 'Lock player to this team';
            lockBtn.addEventListener('click', function() {
                lockedPlayers[team][index] = !lockedPlayers[team][index];
                this.textContent = lockedPlayers[team][index] ? '🔒' : '🔓';
                this.title = lockedPlayers[team][index] ? 'Unlock player' : 'Lock player to this team';
                this.classList.toggle('locked', lockedPlayers[team][index]);
                div.classList.toggle('locked', lockedPlayers[team][index]);
            });

            container.appendChild(div);
            container.appendChild(lockBtn);
            return container;
        }

        // Create goalie div
        function createGoalieDiv(goalieName, team) {
            const div = document.createElement('div');
            div.className = 'player goalie';
            div.innerHTML = `G: <span class="goalie-name" contenteditable="true">${goalieName}</span>`;

            const nameSpan = div.querySelector('.goalie-name');
            nameSpan.addEventListener('blur', function() {
                currentTeams[team].goalie = this.textContent.trim();
            });
            nameSpan.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.blur();
                }
            });

            return div;
        }

        // Randomize teams
        function randomizeTeams() {
            // Collect locked players with their positions
            const lockedWhite = [];
            const lockedBlack = [];
            const unlockedPlayers = [];

            currentTeams.white.players.forEach((player, index) => {
                if (lockedPlayers.white[index]) {
                    lockedWhite.push({ player, index });
                } else {
                    unlockedPlayers.push(player);
                }
            });

            currentTeams.black.players.forEach((player, index) => {
                if (lockedPlayers.black[index]) {
                    lockedBlack.push({ player, index });
                } else {
                    unlockedPlayers.push(player);
                }
            });

            // Shuffle only the unlocked players
            const shuffled = shuffleArray([...unlockedPlayers]);

            // Calculate how many unlocked slots each team has
            const whiteTeamSize = currentTeams.white.players.length;
            const blackTeamSize = currentTeams.black.players.length;
            const whiteUnlockedSlots = whiteTeamSize - lockedWhite.length;
            const blackUnlockedSlots = blackTeamSize - lockedBlack.length;

            // Split shuffled players for unlocked slots
            const shuffledForWhite = shuffled.slice(0, whiteUnlockedSlots);
            const shuffledForBlack = shuffled.slice(whiteUnlockedSlots, whiteUnlockedSlots + blackUnlockedSlots);

            // Build new teams
            const newWhitePlayers = new Array(whiteTeamSize);
            const newBlackPlayers = new Array(blackTeamSize);
            const newWhiteLocks = new Array(whiteTeamSize).fill(false);
            const newBlackLocks = new Array(blackTeamSize).fill(false);

            // Place locked players in their positions
            lockedWhite.forEach(({ player, index }) => {
                newWhitePlayers[index] = player;
                newWhiteLocks[index] = true;
            });
            lockedBlack.forEach(({ player, index }) => {
                newBlackPlayers[index] = player;
                newBlackLocks[index] = true;
            });

            // Fill in unlocked slots with shuffled players
            let shuffledWhiteIndex = 0;
            let shuffledBlackIndex = 0;
            for (let i = 0; i < whiteTeamSize; i++) {
                if (newWhitePlayers[i] === undefined) {
                    newWhitePlayers[i] = shuffledForWhite[shuffledWhiteIndex++];
                }
            }
            for (let i = 0; i < blackTeamSize; i++) {
                if (newBlackPlayers[i] === undefined) {
                    newBlackPlayers[i] = shuffledForBlack[shuffledBlackIndex++];
                }
            }

            // Update teams and lock states
            currentTeams.white.players = newWhitePlayers;
            currentTeams.black.players = newBlackPlayers;
            lockedPlayers.white = newWhiteLocks;
            lockedPlayers.black = newBlackLocks;

            // Goalies stay the same (never on the same team)
            displayTeams();
            showNotification('Teams randomized!');
        }

        // Shuffle array using Fisher-Yates algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Reset to default teams
        function resetToDefault() {
            currentTeams = JSON.parse(JSON.stringify(defaultTeams));
            // Clear all locks
            lockedPlayers = {
                white: new Array(defaultTeams.white.players.length).fill(false),
                black: new Array(defaultTeams.black.players.length).fill(false)
            };
            displayTeams();
            showNotification('Teams reset to default!');
        }

        // Capture screenshot and copy to clipboard
        async function captureScreenshot() {
            const teamsDisplay = document.getElementById('teams-display');

            try {
                // Use html2canvas to capture the teams display
                const canvas = await html2canvas(teamsDisplay, {
                    backgroundColor: null,
                    scale: 2, // Higher quality
                    logging: false
                });

                // Convert canvas to blob
                canvas.toBlob(async (blob) => {
                    try {
                        // Copy to clipboard
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob
                            })
                        ]);
                        showNotification('Screenshot copied to clipboard!');
                    } catch (err) {
                        console.error('Failed to copy to clipboard:', err);
                        // Fallback: download the image
                        const url = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        link.download = 'hockey-teams.png';
                        link.href = url;
                        link.click();
                        showNotification('Screenshot downloaded! (Clipboard not supported)');
                    }
                });
            } catch (err) {
                console.error('Failed to capture screenshot:', err);
                showNotification('Failed to capture screenshot', true);
            }
        }

        // Share to WhatsApp using Web Share API
        async function shareToWhatsApp() {
            const teamsDisplay = document.getElementById('teams-display');

            try {
                // Use html2canvas to capture the teams display
                const canvas = await html2canvas(teamsDisplay, {
                    backgroundColor: null,
                    scale: 2,
                    logging: false
                });

                // Convert canvas to blob
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'hockey-teams.png', { type: 'image/png' });

                    // Check if Web Share API with files is supported
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'IHL Teams',
                                text: 'Tonight\'s hockey teams!'
                            });
                            showNotification('Shared successfully!');
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.error('Share failed:', err);
                                showNotification('Share cancelled or failed', true);
                            }
                        }
                    } else {
                        // Fallback: Open WhatsApp with text only
                        const whiteTeam = currentTeams.white.players.join(', ') + ' (G: ' + currentTeams.white.goalie + ')';
                        const blackTeam = currentTeams.black.players.join(', ') + ' (G: ' + currentTeams.black.goalie + ')';
                        const text = `IHL Teams\n\nWhite: ${whiteTeam}\n\nBlack: ${blackTeam}`;
                        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
                        window.open(whatsappUrl, '_blank');
                        showNotification('Opening WhatsApp... (image sharing not supported on this device)');
                    }
                }, 'image/png');
            } catch (err) {
                console.error('Failed to capture screenshot:', err);
                showNotification('Failed to capture screenshot', true);
            }
        }

        // Show notification
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.backgroundColor = isError ? '#f44336' : '#4CAF50';
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
